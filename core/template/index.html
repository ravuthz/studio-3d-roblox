<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>__TITLE__</title>
    <script src="core/vendor/gsap.min.js"></script>
    <script src="story/timing.js"></script>
    <script src="story/plan.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./core/vendor/three/build/three.module.js",
          "three/addons/": "./core/vendor/three/addons/",
          "core/": "./core/engine/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Fredoka";
        font-weight: 700;
        src: url("core/vendor/fonts/fredoka-latin-700-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0d1a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Fredoka", sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* one-word captions, centred at about 68% of the frame height */
      #captions {
        position: absolute;
        inset: 0;
        padding-top: 1240px;
        display: grid;
        justify-items: center;
        align-items: start;
      }
      .word {
        grid-area: 1 / 1;
        display: block;
        white-space: nowrap;
        font-weight: 700;
        font-size: 104px;
        line-height: 1;
        color: #e8ff3a;
        -webkit-text-stroke: 16px #101014;
        paint-order: stroke fill;
        text-shadow: 0 10px 0 rgba(0, 0, 0, 0.45);
        opacity: 0;
      }
      .word.big {
        font-size: 146px;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="flash" class="clip" data-start="0" data-duration="10" data-track-index="1"></div>
      <div id="captions" class="clip" data-start="0" data-duration="10" data-track-index="2"></div>
      <audio id="vo" src="assets/audio/vo.mp3" data-start="0" data-track-index="3" data-volume="1"></audio>
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="10" data-track-index="4" data-volume="0.2"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="10" data-track-index="5" data-volume="0.45"></audio>
    </div>
    <script type="module" src="film.js"></script>
    <script src="core/engine/captions.js"></script>
  </body>
</html>
