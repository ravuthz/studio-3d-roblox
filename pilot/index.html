<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>In this town, everyone is born with a number</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="story/timing.js"></script>
    <script src="story/plan.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Fredoka";
        font-weight: 700;
        src: url("vendor/fonts/fredoka-latin-700-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0d1a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Fredoka", sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* one-word captions, centred at about 68% of the frame height */
      #captions {
        position: absolute;
        inset: 0;
        padding-top: 1240px;
        display: grid;
        justify-items: center;
        align-items: start;
      }
      .word {
        grid-area: 1 / 1;
        display: block;
        white-space: nowrap;
        font-weight: 700;
        font-size: 104px;
        line-height: 1;
        color: #e8ff3a;
        -webkit-text-stroke: 16px #101014;
        paint-order: stroke fill;
        text-shadow: 0 10px 0 rgba(0, 0, 0, 0.45);
        opacity: 0;
      }
      .word.big {
        font-size: 146px;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="30" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="flash" class="clip" data-start="0" data-duration="30" data-track-index="1"></div>
      <div id="captions" class="clip" data-start="0" data-duration="30" data-track-index="2"></div>
      <audio id="vo" src="assets/audio/vo.mp3" data-start="0" data-track-index="3" data-volume="1"></audio>
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="30" data-track-index="4" data-volume="0.2"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="5" data-volume="0.45"></audio>
    </div>
    <script type="module" src="src/scene.js"></script>
    <script>
      (function () {
        const T = window.STORY_TIMING;
        const P = window.STORY_PLAN;
        const tl = gsap.timeline({ paused: true });
        const box = document.getElementById("captions");
        const proper = new Set(["zero", "zeebra", "luna", "zip", "i"]);
        T.words.forEach((w, i) => {
          const line = T.lines[w.line];
          const bare = w.w.replace(/[.,!]/g, "");
          const key = bare.replace(/[^A-Za-z]/g, "");
          const isName = proper.has(key.toLowerCase()) && !(line.id === "me" && key.toLowerCase() === "zero");
          const el = document.createElement("span");
          el.className = "word" + (line.big.some((b) => b.toLowerCase() === key.toLowerCase()) ? " big" : "");
          el.textContent = isName ? bare : bare.toLowerCase();
          box.appendChild(el);
          const next = T.words[i + 1];
          const off = next ? Math.min(next.s, w.e + 0.45) : w.e + 0.5;
          tl.set(el, { opacity: 1 }, w.s);
          tl.fromTo(el, { scale: 0.35 }, { scale: 1, duration: 0.13, ease: "back.out(2.6)" }, w.s);
          tl.set(el, { opacity: 0 }, Math.max(off, w.s + 0.08));
        });
        // white flash on the night snap, the tower reveal and the final beat
        [P.cuts.night, P.cuts.cliffA, P.cuts.cliffB].forEach((t) => {
          tl.set("#flash", { opacity: 0.7 }, t);
          tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, t + 0.001);
        });
        tl.set({}, {}, P.duration);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
